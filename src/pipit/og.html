<!doctype html>
<html class="pipit">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/pipit.css">
<style>
  html { font-size: 16px; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0c261e; color: #f2f6f4; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(900px 500px at 75% 30%, rgb(35 107 84 / 0.45), transparent 70%),
      radial-gradient(1000px 600px at 15% 0%, rgb(20 60 47 / 0.35), transparent 75%),
      #0c261e;
  }
  .id { position: absolute; left: 84px; top: 80px; display: flex; align-items: center; gap: 18px; }
  .id img { width: 72px; height: 72px; border-radius: 17px; outline: 1px solid var(--icon-edge); }
  .id b { display: block; font-size: 28px; line-height: 1.2; font-weight: 600; font-stretch: 108%; }
  .id small { display: block; font-size: 19px; color: var(--ink-2); }
  h1 {
    position: absolute;
    left: 84px;
    top: 188px;
    width: 580px;
    font-size: 64px;
    line-height: 1.05;
    text-wrap: balance;
    background: linear-gradient(180deg, #ffffff 40%, #b8edd6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .free { position: absolute; left: 84px; font-size: 22px; color: var(--ink-2); }
  .console-preview {
    position: absolute;
    right: 84px;
    top: 96px;
    width: 420px;
    padding: 32px;
    border-radius: 28px;
    background: linear-gradient(180deg, rgb(19 59 46 / 0.9) 0%, rgb(11 36 28 / 0.98) 100%);
    border: 1px solid var(--line);
    box-shadow: 0 0 60px -10px var(--glow-color);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .vf-mock {
    position: relative;
    width: 280px;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    border: 1px solid rgb(142 221 184 / 0.3);
  }
  .vf-mock img { width: 100%; height: 100%; object-fit: cover; }
  .pill { margin-top: 24px; padding: 6px 16px; border-radius: 999px; background: rgb(142 221 184 / 0.2); border: 1px solid var(--brand); color: #ffffff; font-size: 0.9375rem; font-weight: 600; }
  .metrics {
    margin-top: 18px;
    font-family: monospace;
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--brand);
    text-align: center;
  }
  .caption { margin-top: 10px; font-size: 0.8125rem; color: var(--ink-2); text-align: center; }
</style>
</head>
<body class="dark">
<div class="card">
  <div class="id">
    <img src="/assets/img/icon-pipit.webp" alt="">
    <span><b>Pipit</b><small id="tagline"></small></span>
  </div>
  <h1 id="h1"></h1>
  <p class="free" id="free"></p>
  <div class="console-preview">
    <div class="vf-mock">
      <img src="/assets/img/pipit/sample-photo.webp" alt="">
      <div class="vf-corner vf-tl" style="border-color: #8eddb8; width: 16px; height: 16px;"></div>
      <div class="vf-corner vf-tr" style="border-color: #8eddb8; width: 16px; height: 16px;"></div>
      <div class="vf-corner vf-bl" style="border-color: #8eddb8; width: 16px; height: 16px;"></div>
      <div class="vf-corner vf-br" style="border-color: #8eddb8; width: 16px; height: 16px;"></div>
    </div>
    <div class="pill" id="pill"></div>
    <div class="metrics" id="metrics">3.5 MB → 48.7 KB (-98.6%)</div>
    <p class="caption" id="caption"></p>
  </div>
</div>
<script>
  document.documentElement.lang = OG.lang;
  for (const key of ["tagline", "free", "pill", "metrics", "caption"]) document.getElementById(key).textContent = OG[key];
  document.getElementById("h1").innerHTML = OG.h1;

  const h1 = document.getElementById("h1"), free = document.getElementById("free");
  document.fonts.ready.then(() => {
    let size = 64;
    const lines = () => h1.offsetHeight / (parseFloat(getComputedStyle(h1).lineHeight) || size);
    while (size > 40 && (lines() > 4.2 || h1.scrollWidth > h1.clientWidth || h1.offsetTop + h1.offsetHeight > 480)) h1.style.fontSize = (size -= 2) + "px";
    free.style.top = h1.offsetTop + h1.offsetHeight + 28 + "px";
    document.body.dataset.ready = "1";
  });
</script>
</body>
</html>
